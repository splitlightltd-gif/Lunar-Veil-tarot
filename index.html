<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunar Veil Tarot - Descoperă Potențialul Tău</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            /* Aici am adăugat o imagine mistică de fundal în spatele site-ului */
            background-image: linear-gradient(rgba(26, 9, 51, 0.85), rgba(26, 9, 51, 0.85)), url('https://unsplash.com');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container { 
            background: #2a144d; 
            max-width: 800px;
            width: 100%;
            border-radius: 15px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.7); 
            overflow: hidden;
            text-align: center;
            border: 2px solid #d4af37; /* Margine aurie puțin mai groasă */
        }
        .promo-img {
            width: 100%;
            height: auto;
            display: block;
            border-bottom: 2px solid #d4af37;
        }
        .content {
            padding: 45px 35px;
        }
        h1 { 
            color: #d4af37; 
            font-size: 2.6rem; /* Dimensiune optimă pe PC */
            margin-bottom: 20px;
            letter-spacing: 1px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        p { 
            color: #dfd5f0; 
            font-size: 1.4rem; /* Dimensiune optimă pe PC */
            line-height: 1.7;
            margin-bottom: 35px;
        }
        .btn { 
            background: #d4af37; 
            color: #1a0933; 
            padding: 16px 50px; 
            text-decoration: none; 
            border-radius: 30px; 
            display: inline-block; 
            font-weight: bold;
            font-size: 1.3rem; 
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            letter-spacing: 1px;
        }
        .btn:hover {
            background: #f3cd46;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.5);
        }

        /* CONFIGURARE SPECIALĂ PENTRU TELEFON (Mărește scrisul automat pe ecrane mici) */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            .content {
                padding: 30px 15px; /* Spațiu mai compact pe laterale */
            }
            h1 {
                font-size: 2.2rem !important; /* Titlu foarte vizibil pe mobil */
            }
            p {
                font-size: 1.3rem !important; /* Textul descrierii mărit special pentru telefon */
                line-height: 1.6;
            }
            .btn {
                font-size: 1.2rem !important;
                width: 100%; /* Butonul ocupă toată lățimea pe telefon ca să fie ușor de apăsat */
                padding: 15px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="image_16901475.jpg" alt="Lunar Veil Tarot Banner" class="promo-img">
        
        <div class="content">
            <h1>🔮 Lunar Veil Tarot</h1>
            <p>Lecturi în Carieră, Calea Vieții și Ghidare Profundă a Sufletului. Trimite un e-mail pentru a rezerva o ședință personalizată.</p>
            
            <!-- Pune e-mailul tău în loc de adresa de mai jos -->
            <a href="splitlight.ltd@gmail.com" class="btn">BOOK NOW</a>
        </div>
    </div>
</body>
</html>
