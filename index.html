<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunar Veil Tarot - Descoperă Potențialul Tău</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #1a0933; 
            color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container { 
            background: #2a144d; 
            max-width: 600px;
            width: 100%;
            border-radius: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            overflow: hidden;
            text-align: center;
            border: 1px solid #d4af37; /* Margine aurie subtilă */
        }
        .promo-img {
            width: 100%;
            height: auto;
            display: block;
            border-bottom: 2px solid #d4af37;
        }
        .content {
            padding: 35px 25px;
        }
        h1 { 
            color: #d4af37; /* Culoare aurie pentru titlu */
            font-size: 1.8rem;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        p { 
            color: #dfd5f0; 
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .btn { 
            background: #d4af37; 
            color: #1a0933; 
            padding: 12px 30px; 
            text-decoration: none; 
            border-radius: 25px; 
            display: inline-block; 
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
        .btn:hover {
            background: #f3cd46;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Imaginea ta promoțională cu numele exact din proiectul tău -->
        <img src="image_16901475.jpg" alt="Lunar Veil Tarot Banner" class="promo-img">
        
        <div class="content">
            <h1>🔮 Lunar Veil Tarot</h1>
            <p>Lecturi în Dragoste, Calea Vieții și Ghidare Profundă a Sufletului. Rezervă o ședință acum și explorează-ți calea.</p>
            <a href="https://github.com" class="btn">BOOK NOW</a>
        </div>
    </div>
</body>
</html>
